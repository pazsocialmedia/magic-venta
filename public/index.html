<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleccion Magic en venta</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <h1 id="store-name">Coleccion Magic</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <p id="update-info" class="update-info"></p>
  </header>

  <main class="layout">
    <section class="catalog">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar carta por nombre..." autocomplete="off" />
        <button id="toggle-filters" class="btn-secondary" type="button" aria-expanded="false">Filtros</button>
        <label class="sort">
          Orden:
          <select id="sort">
            <option value="name">Nombre</option>
            <option value="price-asc">Precio ↑</option>
            <option value="price-desc">Precio ↓</option>
            <option value="set">Set</option>
          </select>
        </label>
      </div>

      <div id="filters" class="filters" hidden>
        <div class="filter-group">
          <span class="filter-label">Color</span>
          <div id="filter-colors" class="chips"></div>
        </div>
        <div class="filter-row">
          <label>Set <select id="filter-set"><option value="">Todos</option></select></label>
          <label>Rareza <select id="filter-rarity"><option value="">Todas</option></select></label>
          <label>Tipo <select id="filter-tipo"><option value="">Todos</option></select></label>
        </div>
        <div class="filter-row">
          <label>Maná <select id="filter-mana"><option value="">Cualquiera</option></select></label>
          <label>Acabado
            <select id="filter-foil">
              <option value="">Ambos</option>
              <option value="foil">Solo foil</option>
              <option value="normal">Solo normal</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="filter-instock" /> Solo con stock</label>
        </div>
        <div class="filter-row">
          <label>Precio USD desde <input type="number" id="filter-min" min="0" step="0.5" placeholder="0" /></label>
          <label>hasta <input type="number" id="filter-max" min="0" step="0.5" placeholder="∞" /></label>
          <button id="clear-filters" class="btn-secondary" type="button">Limpiar</button>
        </div>
      </div>

      <p id="result-count" class="result-count"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>No hay cartas que coincidan con los filtros.</p>
    </section>

    <aside id="cart" class="cart">
      <h2>Tu pedido <span id="cart-count" class="badge">0</span></h2>
      <div id="cart-items" class="cart-items"></div>
      <p id="cart-empty" class="cart-empty">Todavia no agregaste cartas.</p>
      <div class="cart-totals">
        <div class="total-line"><span>Total USD</span><strong id="total-usd">US$ 0</strong></div>
        <div class="total-line" id="total-uyu-line"><span>Total UYU</span><strong id="total-uyu">$U 0</strong></div>
      </div>
      <div class="cart-actions">
        <button id="copy-order" class="btn-primary" type="button">Copiar pedido</button>
        <a id="whatsapp-order" class="btn-whatsapp" target="_blank" rel="noopener">Enviar por WhatsApp</a>
        <button id="clear-cart" class="btn-link" type="button">Vaciar pedido</button>
      </div>
    </aside>
  </main>

  <!-- Lightbox para agrandar imagen en mobile -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="" />
  </div>

  <button id="cart-fab" class="cart-fab" type="button" aria-label="Ver pedido">
    🛒 <span id="fab-count" class="badge">0</span>
  </button>

  <script src="app.js"></script>
</body>
</html>
